<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Theories Word Cloud</title>
    <!-- Load d3.js and d3-cloud libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9fafb;
        }
        #word-cloud-container {
            width: 800px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
        }
        text {
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }
        text:hover {
            opacity: 0.8;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));
        }
        #tooltip {
            position: absolute;
            background: rgba(17, 24, 39, 0.9);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="word-cloud-container">
    <div id="tooltip"></div>
</div>

<script>
    // Raw theory list provided by user
    const rawTheories = [
        "Social Exchange Theory", "Gendered Organization Theory", "Policy Implementation Theory", 
        "Intersectionality", "Managerial Skills Framework", "Integrative Framework", 
        "Sustainable HRM", "CSP Conceptual Framework", "Social Exchange Theory", 
        "International Standards", "Ethical Framework", "Proximal Withdrawal States Theory", 
        "Ethical AI", "HR Governance", "CSR-HRM-AI Framework", "Positivist Research Paradigm", 
        "Implementation Framework", "Project Management Framework", "Information Systems Theory", 
        "Resource-Based Theory", "Resource-Based View", "Institutional Theory", 
        "Technological/Organizational Restructuring Framework", "Human-AI Balance", 
        "Technology Adoption", "Dynamic Capabilities Theory", "I-O Psychology", 
        "HRM Big-Data Framework", "Lazarus Appraisal Theory", "Emotional Intelligence", 
        "Skill-Biased Technological Progress", "Labor Market Segmentation Theory", 
        "Human-Centered Industry 5.0"
    ];

    // Count frequencies of each phrase
    const counts = {};
    rawTheories.forEach(t => {
        counts[t] = (counts[t] || 0) + 1;
    });

    // Map to words array format for d3-cloud
    const words = Object.keys(counts).map(text => ({
        text: text,
        size: counts[text] === 1 ? 14 : 26 // Higher weight to repeating theories like Social Exchange
    }));

    const width = 800;
    const height = 500;
    const colors = ["#2563eb", "#3b82f6", "#06b6d4", "#0d9488", "#10b981", "#8b5cf6", "#6366f1", "#f59e0b"];

    const layout = d3.layout.cloud()
        .size([width, height])
        .words(words)
        .padding(6)
        .rotate(() => (Math.random() > 0.6 ? 90 : 0))
        .fontSize(d => d.size)
        .on("end", draw);

    layout.start();

    function draw(words) {
        const svg = d3.select("#word-cloud-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${width / 2},${height / 2})`);

        const tooltip = d3.select("#tooltip");

        svg.selectAll("text")
            .data(words)
            .enter().append("text")
            .style("font-size", d => `${d.size}px`)
            .style("font-weight", "600")
            .style("fill", () => colors[Math.floor(Math.random() * colors.length)])
            .attr("text-anchor", "middle")
            .attr("transform", d => `translate(${d.x},${d.y})rotate(${d.rotate})`)
            .text(d => d.text)
            .on("mouseover", function(event, d) {
                tooltip.style("opacity", 1)
                       .html(`<strong>${d.text}</strong><br>Occurrences: ${counts[d.text]}`);
                d3.select(this).style("transform", "scale(1.05)");
            })
            .on("mousemove", function(event) {
                const container = document.getElementById('word-cloud-container').getBoundingClientRect();
                tooltip.style("left", (event.clientX - container.left + 15) + "px")
                       .style("top", (event.clientY - container.top + 15) + "px");
            })
            .on("mouseout", function() {
                tooltip.style("opacity", 0);
                d3.select(this).style("transform", "scale(1)");
            });
    }
</script>

</body>
</html>
